<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL AUDIBLE V.3.0</title>
    <style>
        :root { --red: #ff4d4d; --glow: 0 0 15px #ff0000; }
        body { 
            background: #050505; color: var(--red); font-family: 'Courier New', monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; overflow: hidden; text-transform: uppercase;
        }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000; display: flex; align-items: center; justify-content: center;
        }
        .start-btn {
            padding: 20px 40px; font-size: 1.5rem; background: var(--red); color: #000;
            border: none; cursor: pointer; font-weight: bold; box-shadow: var(--glow);
        }
        #display-container {
            border: 2px solid var(--red); padding: 20px; box-shadow: var(--glow);
            background: rgba(20, 0, 0, 0.8); border-radius: 10px; text-align: center;
            width: 90%; max-width: 350px;
        }
        #timer { font-size: 4.5rem; font-weight: 900; margin: 15px 0; text-shadow: var(--glow); }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .key {
            background: #300; border: 1px solid var(--red); color: var(--red);
            padding: 15px; font-size: 1.2rem; cursor: pointer; border-radius: 5px;
        }
        .key:active { background: var(--red); color: #000; }
        #code-display { background: #000; border: 1px inset var(--red); height: 40px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; letter-spacing: 10px; }
    </style>
</head>
<body>

    <div id="overlay">
        <button class="start-btn" onclick="startSystem()">INICIAR SISTEMA</button>
    </div>

    <div id="display-container">
        <div style="font-size: 0.7rem; letter-spacing: 2px;">AUDIO E INTERFAZ ARMADA</div>
        <div id="timer">00:45</div>
        <div id="code-display"></div>
        <div class="keypad">
            <div class="key" onclick="press('1')">1</div><div class="key" onclick="press('2')">2</div><div class="key" onclick="press('3')">3</div>
            <div class="key" onclick="press('4')">4</div><div class="key" onclick="press('5')">5</div><div class="key" onclick="press('6')">6</div>
            <div class="key" onclick="press('7')">7</div><div class="key" onclick="press('8')">8</div><div class="key" onclick="press('9')">9</div>
            <div class="key" style="opacity:0"></div><div class="key" onclick="press('0')">0</div><div class="key" onclick="clearCode()">C</div>
        </div>
    </div>

    <script>
        const CORRECT_CODE = "7412";
        let timeLeft = 45;
        let currentInput = "";
        let active = false;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(freq, duration, type = 'square') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function startSystem() {
            document.getElementById('overlay').style.display = 'none';
            active = true;
            audioCtx.resume();
            runTimer();
        }

        function runTimer() {
            const countdown = setInterval(() => {
                if (!active) { clearInterval(countdown); return; }
                timeLeft--;
                
                // Sonido de Beep normal
                playBeep(880, 0.1); 

                // Alerta extra cuando queda poco tiempo
                if (timeLeft <= 10 && timeLeft > 0) {
                    setTimeout(() => playBeep(1200, 0.05, 'sawtooth'), 500);
                }

                document.getElementById('timer').innerText = `00:${timeLeft < 10 ? '0' + timeLeft : timeLeft}`;

                if (timeLeft <= 0) {
                    active = false;
                    clearInterval(countdown);
                    playBeep(100, 2, 'sawtooth'); // Sonido de explosión (low freq)
                    alert("¡BOOM!");
                }
            }, 1000);
        }

        function press(num) {
            if (!active) return;
            playBeep(440, 0.05, 'sine');
            currentInput += num;
            document.getElementById('code-display').innerText = "*".repeat(currentInput.length);
            if (currentInput.length === 4) checkCode();
        }

        function clearCode() {
            currentInput = "";
            document.getElementById('code-display').innerText = "";
        }

        function checkCode() {
            if (currentInput === CORRECT_CODE) {
                active = false;
                playBeep(1200, 0.5, 'sine');
                document.getElementById('timer').style.color = "#00ff00";
                document.getElementById('timer').innerText = "SAFE";
                alert("BOMBA DESACTIVADA");
            } else {
                playBeep(200, 0.3, 'square');
                timeLeft = Math.max(0, timeLeft - 5);
                clearCode();
            }
        }
    </script>
</body>
</html>
