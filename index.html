<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.B.A.P. - Ministerio del Interior</title>
    <style>
        body {
            background-color: #050505;
            color: #33ff33;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 750px;
            border: 1px solid #33ff33;
            padding: 30px;
            background-color: #0a0a0a;
            box-shadow: 0 0 15px rgba(51, 255, 51, 0.1);
        }
        .header {
            text-align: center;
            border-bottom: 1px dashed #33ff33;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 2px;
        }
        .header p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: #888;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input[type="text"] {
            flex-grow: 1;
            background-color: #000;
            color: #33ff33;
            border: 1px solid #33ff33;
            padding: 12px;
            font-family: inherit;
            font-size: 16px;
            text-transform: uppercase;
            outline: none;
        }
        input[type="text"]:focus {
            box-shadow: 0 0 8px rgba(51, 255, 51, 0.4);
        }
        button {
            background-color: #33ff33;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover {
            background-color: #28cc28;
        }
        #terminal-output {
            min-height: 250px;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            border-top: 1px dotted #33ff33;
            padding-top: 15px;
        }
        .alert-roja {
            color: #ff3333;
            font-weight: bold;
        }
        .codigo-bloque {
            background-color: #33ff33;
            color: #000;
            padding: 2px 6px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>SISTEMA DE BÚSQUEDA DE ANTECEDENTES POLICIALES</h1>
            <p>MINISTERIO DEL INTERIOR - UNIDAD DE INTELIGENCIA DE CHICLAYO</p>
            <p style="color: #ff3333;">NIVEL DE ACCESO REQUERIDO: TÁCTICO</p>
        </div>

        <div style="margin-bottom: 10px; font-size: 13px;">
            >> INGRESE EL NOMBRE O APELLIDO DEL OBJETIVO A CONSULTAR:
        </div>
        
        <div class="input-group">
            <input type="text" id="busqueda" placeholder="Ej. JUAN PEREZ" autocomplete="off">
            <button onclick="buscarExpediente()">Ejecutar</button>
        </div>

        <div id="terminal-output">>> ESPERANDO CONSULTA...<span class="blink">_</span></div>
    </div>

    <script>
        function buscarExpediente() {
            const inputRaw = document.getElementById('busqueda').value.toUpperCase().trim();
            const terminal = document.getElementById('terminal-output');
            
            // Remover tildes para evitar errores de tipeo del jugador
            const input = inputRaw.normalize("NFD").replace(/[\u0300-\u036f]/g, "");

            terminal.innerHTML = ">> ESTABLECIENDO CONEXIÓN SEGURA...\n>> DESENCRIPTANDO EXPEDIENTES...<span class='blink'>_</span>";
            
            setTimeout(() => {
                if (input === 'IGNACIO MONTENEGRO' || input === 'IGNACIO' || input === 'MONTENEGRO') {
                    terminal.innerHTML = `>> EXPEDIENTE CLASIFICADO ENCONTRADO.

<strong>NOMBRES:</strong> IGNACIO
<strong>APELLIDOS:</strong> MONTENEGRO
<strong>ESTADO:</strong> PRÓFUGO / LÍDER IDEOLÓGICO
<strong>DOMICILIO DECLARADO:</strong> AVENIDA GRAU N° 880

>> VULNERACIÓN DE RED AUTORIZADA: Extrayendo metadatos vinculados al enrutador de la bóveda subterránea...

<span class="alert-roja">>> ADVERTENCIA: CLAVE CRIPTOGRÁFICA FRAGMENTADA.</span>
>> EXTRACCIÓN DEL BLOQUE [1 DE 4] COMPLETADA: <span class="codigo-bloque">ALFA</span><span class="blink">_</span>`;
                } 
                else if (input === 'SAMUEL ORTIZ' || input === 'SAMUEL' || input === 'ORTIZ') {
                    terminal.innerHTML = `>> EXPEDIENTE ENCONTRADO.

<strong>NOMBRES:</strong> SAMUEL
<strong>APELLIDOS:</strong> ORTIZ
<strong>ESTADO:</strong> INVESTIGADO / FONDOS CONGELADOS
<strong>VÍNCULO:</strong> PROPIETARIO DE IMPRENTA COMERCIAL

>> VULNERACIÓN DE RED AUTORIZADA: Extrayendo metadatos vinculados al enrutador de la bóveda subterránea...

<span class="alert-roja">>> ADVERTENCIA: CLAVE CRIPTOGRÁFICA FRAGMENTADA.</span>
>> EXTRACCIÓN DEL BLOQUE [2 DE 4] COMPLETADA: <span class="codigo-bloque">77</span><span class="blink">_</span>`;
                }
                else if (input === 'DANTE CRUZ' || input === 'DANTE' || input === 'CRUZ') {
                    terminal.innerHTML = `>> EXPEDIENTE ENCONTRADO.

<strong>NOMBRES:</strong> DANTE
<strong>APELLIDOS:</strong> CRUZ
<strong>ESTADO:</strong> PRÓFUGO / ORDEN DE CAPTURA ACTIVA
<strong>VÍNCULO:</strong> EX-OPERARIO DE CARGA PORTUARIA (BRAZO ARMADO)

>> VULNERACIÓN DE RED AUTORIZADA: Extrayendo metadatos vinculados al enrutador de la bóveda subterránea...

<span class="alert-roja">>> ADVERTENCIA: CLAVE CRIPTOGRÁFICA FRAGMENTADA.</span>
>> EXTRACCIÓN DEL BLOQUE [3 DE 4] COMPLETADA: <span class="codigo-bloque">OMEGA</span><span class="blink">_</span>`;
                }
                else if (input === 'LUCAS ZORRILLA' || input === 'LUCAS' || input === 'ZORRILLA') {
                    terminal.innerHTML = `>> EXPEDIENTE ENCONTRADO.

<strong>NOMBRES:</strong> LUCAS
<strong>APELLIDOS:</strong> ZORRILLA
<strong>ESTADO:</strong> PRÓFUGO / INFILTRADO TOPOGRÁFICO
<strong>VÍNCULO:</strong> EMPLEADO MUNICIPAL (CESADO)

>> VULNERACIÓN DE RED AUTORIZADA: Extrayendo metadatos vinculados al enrutador de la bóveda subterránea...

<span class="alert-roja">>> ADVERTENCIA: CLAVE CRIPTOGRÁFICA FRAGMENTADA.</span>
>> EXTRACCIÓN DEL BLOQUE [4 DE 4] COMPLETADA: <span class="codigo-bloque">99X</span><span class="blink">_</span>`;
                }
                else if (input === '') {
                    terminal.innerHTML = `<span class="alert-roja">>> ERROR DE SINTAXIS. SE REQUIERE UN PARÁMETRO DE BÚSQUEDA.</span><span class="blink">_</span>`;
                } 
                else {
                    terminal.innerHTML = `>> BÚSQUEDA FINALIZADA.
>> 0 RESULTADOS ENCONTRADOS PARA: "${inputRaw}".

<span class="alert-roja">>> EL SUJETO NO EXISTE EN LA BASE DE DATOS O NO ESTÁ VINCULADO AL CÓDIGO DE LA BÓVEDA.</span><span class="blink">_</span>`;
                }
            }, 1200);
        }
    </script>
</body>
</html>
